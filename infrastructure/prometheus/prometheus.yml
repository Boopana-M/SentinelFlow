global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'sentinelflow-gateways'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'gateway-1:8080'
          - 'gateway-2:8084'
          - 'gateway-3:8085'
        labels:
          role: 'gateway'

  - job_name: 'sentinelflow-backends'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'backend-1:8081'
          - 'backend-2:8082'
          - 'backend-3:8083'
        labels:
          role: 'backend'
