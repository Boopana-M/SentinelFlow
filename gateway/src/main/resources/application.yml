server:
  port: ${PORT:8080}

gateway:
  instance-id: ${GATEWAY_INSTANCE_ID:gateway-1}
  health:
    enabled: true
    check-interval-ms: 5000
    timeout-ms: 2000
    failure-threshold: 3
    recovery-threshold: 3
    instances:
      - id: backend-1
        host: ${BACKEND_1_HOST:localhost}
        port: ${BACKEND_1_PORT:8081}
      - id: backend-2
        host: ${BACKEND_2_HOST:localhost}
        port: ${BACKEND_2_PORT:8082}
      - id: backend-3
        host: ${BACKEND_3_HOST:localhost}
        port: ${BACKEND_3_PORT:8083}
  security:
    jwt:
      secret: ${JWT_SECRET:SentinelFlowDistributedGatewayUltraSecureSecretKey2026!@#$%^&*()_+}
      expiration-ms: 86400000

spring:
  application:
    name: sentinelflow-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      backendService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50.0
        wait-duration-in-open-state: 5000ms
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      backendService:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
